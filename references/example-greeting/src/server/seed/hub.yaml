appConfigs:
  - name: greeting.GreetingConfig
    value: '{"defaultPageSize":20}'
portalEntries:
  - name: greeting-local
    protocol: http
    listenIPs: [127.0.0.1]
    http:
      host: ""
      http: ENABLED
      https: DISABLED
      autohttps: DISABLED
      httpPort: 7188
portalSites:
  - name: greeting-rpc
    type: RPCGW
    actorSkelName: greeting.GreetingActor
    cors:
      mode: STRICT
      allowedOrigins:
        - http://127.0.0.1:7188
portalRules:
  - name: greeting-api
    entryName: greeting-local
    matchPathPrefix: /api
    routeType: SITE
    routeSiteName: greeting-rpc
