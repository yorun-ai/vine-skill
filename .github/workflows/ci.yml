name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  required-checks:
    name: CI / Required Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tested baseline
        id: baseline
        shell: bash
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          for key, value in json.loads(Path("scripts/baseline.json").read_text()).items():
              print(f"{key}={value}")
          PYTHON

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.baseline.outputs.go }}
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install pinned skelc
        run: go install go.yorun.ai/skel/cmd/skelc@${{ steps.baseline.outputs.skelc }}

      - name: Validate skill package
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_skill.py

      - name: Validate installation paths for nine agent hosts
        run: python3 scripts/validate_hosts.py

      - name: Validate launcher syntax and Go formatting
        run: |
          bash -n scripts/start_vine_app.sh
          bash -n scripts/validate_example.sh
          bash -n references/example-domains/generate.sh
          test -z "$(gofmt -l references/example-greeting/src/server references/example-domains/src/server scripts/frontend_assets_test.go.txt scripts/frontend_proxy_test.go.txt)"

      - name: Run Linux launcher preflight
        run: |
          fixture="$RUNNER_TEMP/vine-launcher-fixture"
          mkdir -p \
            "$fixture/skel" \
            "$fixture/skeled/golang" \
            "$fixture/skeled/typescript" \
            "$fixture/src/server/seed" \
            "$fixture/src/server/app" \
            "$fixture/src/server/cmd/demo" \
            "$fixture/src/server/core" \
            "$fixture/src/server/impl" \
            "$fixture/src/server/repo" \
            "$fixture/src/web/src" \
            "$fixture/src/web/node_modules"
          printf 'module example.com/demo/src/server\n\ngo 1.27.0\n\nrequire example.com/demo/skeled/golang v0.0.0\n\nreplace example.com/demo/skeled/golang => ../../skeled/golang\n' > "$fixture/src/server/go.mod"
          printf 'module example.com/demo/skeled/golang\n\ngo 1.27.0\n' > "$fixture/skeled/golang/go.mod"
          printf 'appConfigs: []\n' > "$fixture/src/server/seed/hub.yaml"
          printf 'package app\n' > "$fixture/src/server/app/app.go"
          printf 'package main\n\nfunc main() {}\n' > "$fixture/src/server/cmd/demo/main.go"
          printf '{}\n' > "$fixture/src/web/package.json"
          printf '{}\n' > "$fixture/src/web/tsconfig.json"
          VINE_PROJECT_ROOT="$fixture" bash scripts/start_vine_app.sh --check

      - name: Validate published baseline and runtime examples
        run: bash scripts/validate_example.sh

  windows-launcher:
    name: CI / Windows Launcher
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read tested baseline
        id: baseline
        shell: bash
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          for key, value in json.loads(Path("scripts/baseline.json").read_text()).items():
              print(f"{key}={value}")
          PYTHON

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.baseline.outputs.go }}
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Create launcher preflight fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "vine-launcher-fixture"
          $directories = @(
            "skel",
            "skeled/golang",
            "skeled/typescript",
            "src/server/seed",
            "src/server/app",
            "src/server/cmd/demo",
            "src/server/core",
            "src/server/impl",
            "src/server/repo",
            "src/web/src",
            "src/web/node_modules"
          )
          foreach ($directory in $directories) {
            New-Item -ItemType Directory -Force -Path (Join-Path $fixture $directory) | Out-Null
          }
          Set-Content -Path (Join-Path $fixture "src/server/go.mod") -Value "module example.com/demo/src/server`n`ngo 1.27.0`n`nrequire example.com/demo/skeled/golang v0.0.0`n`nreplace example.com/demo/skeled/golang => ../../skeled/golang"
          Set-Content -Path (Join-Path $fixture "skeled/golang/go.mod") -Value "module example.com/demo/skeled/golang`n`ngo 1.27.0"
          Set-Content -Path (Join-Path $fixture "src/server/seed/hub.yaml") -Value "appConfigs: []"
          Set-Content -Path (Join-Path $fixture "src/server/app/app.go") -Value "package app"
          Set-Content -Path (Join-Path $fixture "src/server/cmd/demo/main.go") -Value "package main`n`nfunc main() {}"
          Set-Content -Path (Join-Path $fixture "src/web/package.json") -Value "{}"
          Set-Content -Path (Join-Path $fixture "src/web/tsconfig.json") -Value "{}"
          "VINE_PROJECT_ROOT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows launcher preflight
        shell: cmd
        run: scripts\start_vine_app.bat --check
